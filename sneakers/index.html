<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ATIKUR WEAR — Sneakers</title>
<meta name="description" content="ATIKUR WEAR sneakers — drag the wheel, open a shoe, pick your size.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sneakers.css">
</head>
<body>

<header class="topbar">
  <div class="top-left">
    <a href="../">RAIL</a>
    <a href="../looks/">LOOKS</a>
    <a href="./" class="active">SNEAKERS</a>
  </div>
  <div class="wordmark">ATIKUR&nbsp;WEAR</div>
  <div class="top-right">
    <button class="icon-btn" aria-label="Search">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg>
    </button>
    <button class="icon-btn bag" id="bagBtn" aria-label="Shopping bag">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
      <span class="bag-count" id="bagCount">0</span>
    </button>
  </div>
</header>

<!-- ============ ORBIT VIEW ============ -->
<main class="stage" id="stage">
  <div class="orbit-head">
    <div class="orbit-count" id="orbitCount">01 / 04</div>
    <h1 class="orbit-name" id="orbitName">ORBIT<br>X1</h1>
    <div class="orbit-price" id="orbitPrice">$129.00</div>
    <button class="details-link" id="orbitDetails">View details&nbsp;&nbsp;→</button>
  </div>

  <div class="orbit-field" id="orbitField"></div>

  <div class="watermark">ATIKUR&nbsp;WEAR</div>

  <div class="wheel-wrap">
    <div class="wheel-labels"><span>01</span><span>04</span></div>
    <div class="wheel-track" id="wheelTrack">
      <div class="wheel-fill" id="wheelFill"></div>
      <div class="wheel-handle" id="wheelHandle"></div>
    </div>
    <div class="wheel-hint">DRAG THE WHEEL</div>
  </div>
</main>

<!-- ============ FOCUSED VIEW ============ -->
<section class="focused" id="focused" aria-hidden="true">
  <button class="focused-close" id="focusedClose">Close&nbsp;&nbsp;✕</button>

  <div class="focused-shoe-zone" id="shoeZone">
    <div class="flip" id="flip">
      <div class="flip-inner" id="flipInner">
        <img class="face front" id="shoeFront" src="" alt="Sneaker" draggable="false">
        <img class="face back" id="shoeBack" src="" alt="" draggable="false">
      </div>
    </div>
    <div class="floor-shadow"></div>
    <div class="rotate-hint">DRAG ANY DIRECTION FOR FULL 360°&nbsp;&nbsp;·&nbsp;&nbsp;CLICK TO SPIN</div>
  </div>

  <div class="focused-panel">
    <h2 class="focused-name" id="shoeName">ORBIT<br>X1</h2>
    <div class="focused-price" id="shoePrice">$129.00</div>
    <div class="focused-color" id="shoeColor">White / Black</div>
    <div class="focused-label">SHOE SIZE</div>
    <div class="size-grid" id="sizeGrid"></div>
    <button class="cta-btn" id="ctaBtn">Select a size</button>
    <button class="details-link" id="fullDetails">View full details&nbsp;&nbsp;→</button>
    <p class="focused-desc" id="shoeDesc"></p>
  </div>

  <div class="thumbs" id="thumbs"></div>

  <div class="pager">
    <button class="page-arrow" id="pagePrev" aria-label="Previous shoe">←</button>
    <span class="page-num" id="pageNum">01 / 04</span>
    <button class="page-arrow" id="pageNext" aria-label="Next shoe">→</button>
  </div>
</section>

<div class="toast" id="toast">Added to bag ✓</div>

<footer class="foot">
  Concept demo — interactive clothing website built by <a href="https://atikur.cyou">Atikur Rahman</a>
</footer>

<script src="sneakers.js"></script>
</body>
</html>
