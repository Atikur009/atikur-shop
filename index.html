<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ATIKUR WEAR</title>
<meta name="description" content="ATIKUR WEAR — interactive clothing rail. Drag to browse the collection.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="top-left">
    <a href="#" id="shopLink">SHOP</a>
    <a href="#" id="collectionsLink">COLLECTIONS</a>
  </div>
  <div class="wordmark" id="wordmark">ATIKUR&nbsp;WEAR</div>
  <div class="top-right">
    <button class="icon-btn" aria-label="Search">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg>
    </button>
    <button class="icon-btn bag" id="bagBtn" aria-label="Shopping bag">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
      <span class="bag-count" id="bagCount">0</span>
    </button>
  </div>
</header>

<main class="stage" id="stage">
  <div class="rail-rod"></div>
  <div class="track" id="track"></div>
  <div class="rail-note">SS26 COLLECTION&nbsp;&nbsp;·&nbsp;&nbsp;DRAG TO BROWSE&nbsp;&nbsp;·&nbsp;&nbsp;CLICK A GARMENT TO VIEW</div>
</main>

<section class="product" id="product" aria-hidden="true">
  <button class="edge-arrow left" id="prodPrev" aria-label="Previous product">‹</button>
  <button class="edge-arrow right" id="prodNext" aria-label="Next product">›</button>
  <button class="prod-close" id="prodClose" aria-label="Back to rail">✕</button>

  <div class="prod-stage">
    <div class="prod-hook"></div>
    <img class="prod-img" id="prodImg" src="" alt="Product">
    <div class="prod-variants" id="prodVariants"></div>
  </div>

  <div class="prod-info">
    <div class="prod-name" id="prodName">—</div>
    <div class="prod-price" id="prodPrice">—</div>
    <div class="prod-sizes" id="prodSizes"></div>
    <button class="prod-add" id="prodAdd">ADD TO CART</button>
    <div class="prod-meta">FREE DELIVERY OVER $100&nbsp;&nbsp;·&nbsp;&nbsp;30-DAY RETURNS</div>
  </div>
</section>

<div class="toast" id="toast">Added to bag ✓</div>

<footer class="foot">
  Concept demo — interactive clothing website built by <a href="https://atikur.cyou">Atikur Rahman</a>
</footer>

<script src="app.js"></script>
</body>
</html>
